<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Project Lorenzo Outreach</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Project Lorenzo</h1>
    <nav id="nav" hidden>
      <button data-view="intake">New intake</button>
      <button data-view="search">Find person</button>
      <button data-view="users" data-admin hidden>Users</button>
      <button id="logout" class="secondary">Log out</button>
    </nav>
  </header>

  <main>
    <div id="flash" role="status" hidden></div>

    <section id="view-login" hidden>
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Email <input name="email" type="email" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="view-password" hidden>
      <h2>Set a new password</h2>
      <p>You need to replace your temporary password. Use at least 12 characters.</p>
      <form id="password-form">
        <label>Current password <input name="currentPassword" type="password" autocomplete="current-password" required></label>
        <label>New password <input name="newPassword" type="password" autocomplete="new-password" minlength="12" required></label>
        <button type="submit">Save password</button>
      </form>
    </section>

    <section id="view-intake" hidden>
      <h2>New intake</h2>
      <div class="location-box">
        <strong>Location:</strong> <span id="loc-status">Not captured yet</span>
        <button type="button" id="loc-btn" class="secondary">Use my location</button>
      </div>
      <form id="intake-form">
        <div class="row">
          <label>First name <input name="firstName" maxlength="100"></label>
          <label>Last name <input name="lastName" maxlength="100"></label>
        </div>
        <div class="row">
          <label>Preferred name / nickname <input name="preferredName" maxlength="100"></label>
          <label>Approx. age <input name="approximateAge" type="number" min="0" max="120"></label>
        </div>
        <div class="row">
          <label>Date of birth <input name="dateOfBirth" type="date"></label>
          <label>Gender <input name="gender" maxlength="50"></label>
        </div>
        <div class="row">
          <label>Phone <input name="phone" type="tel" maxlength="30"></label>
          <label>Veteran?
            <select name="veteranStatus">
              <option value="">—</option><option value="yes">Yes</option><option value="no">No</option>
              <option value="unknown">Unknown</option><option value="declined">Declined to say</option>
            </select>
          </label>
        </div>
        <label>Physical description (if no name given) <textarea name="physicalDescription" rows="2" maxlength="1000"></textarea></label>
        <label>Needs (comma separated) <input name="needs" placeholder="food, shelter, medical, ID"></label>
        <label>Where (description) <input name="locationDescription" maxlength="500" placeholder="e.g. bench outside the library"></label>
        <label>Services provided today (comma separated) <input name="servicesProvided" placeholder="meal, water, hygiene kit"></label>
        <label>Notes <textarea name="notes" rows="3" maxlength="5000"></textarea></label>
        <label class="check"><input type="checkbox" name="consentGiven"> Person consented to having their information recorded</label>
        <button type="submit">Save intake</button>
      </form>
    </section>

    <section id="view-search" hidden>
      <h2>Find a person</h2>
      <form id="search-form" class="row">
        <input name="q" placeholder="Name, nickname or phone" aria-label="Search">
        <button type="submit">Search</button>
      </form>
      <ul id="results" class="list"></ul>
    </section>

    <section id="view-person" hidden>
      <button type="button" class="secondary" data-view="search">&larr; Back</button>
      <h2 id="person-name"></h2>
      <dl id="person-details"></dl>
      <h3>Log a new contact</h3>
      <div class="location-box">
        <strong>Location:</strong> <span id="enc-loc-status">Not captured yet</span>
        <button type="button" id="enc-loc-btn" class="secondary">Use my location</button>
      </div>
      <form id="encounter-form">
        <label>Where (description) <input name="locationDescription" maxlength="500"></label>
        <label>Services provided (comma separated) <input name="servicesProvided"></label>
        <label>Notes <textarea name="notes" rows="2" maxlength="5000"></textarea></label>
        <button type="submit">Save contact</button>
      </form>
      <h3>Contact history</h3>
      <ul id="encounters" class="list"></ul>
    </section>

    <section id="view-users" hidden>
      <h2>Team accounts</h2>
      <form id="user-form" class="row">
        <input name="fullName" placeholder="Full name" required aria-label="Full name">
        <input name="email" type="email" placeholder="Email" required aria-label="Email">
        <select name="role" aria-label="Role">
          <option value="volunteer">Volunteer</option><option value="staff">Staff</option><option value="admin">Admin</option>
        </select>
        <button type="submit">Add user</button>
      </form>
      <ul id="users" class="list"></ul>
    </section>
  </main>
</body>
</html>
